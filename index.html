<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S. I. &amp; Co. Web Link Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--text:#172033;--muted:#697586;--line:#e6eaf0;--primary:#4f46e5;--primary2:#7c3aed;--success:#0f9d72;--danger:#dc3d4b;--shadow:0 12px 32px rgba(20,30,55,.07);--radius:18px}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#101828;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:20}.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 26px}.brandmark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;font-weight:800}.brand h1{font-size:17px;margin:0}.brand small{color:#98a2b3}.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#667085;padding:13px 11px 8px}.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;background:transparent;color:#cbd5e1;border-radius:10px;margin:3px 0;text-align:left}.nav button:hover,.nav button.active{background:#1d2939;color:#fff}.nav .count{margin-left:auto;background:#344054;border-radius:20px;padding:2px 7px;font-size:11px}.sidebar-footer{position:absolute;bottom:20px;left:16px;right:16px;border-top:1px solid #253044;padding-top:14px;color:#98a2b3;font-size:11px}.main{margin-left:250px;width:calc(100% - 250px);padding:28px 32px 50px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.page-title h2{margin:0 0 5px;font-size:25px}.page-title p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:10px}.btn{padding:10px 14px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--text)}.btn:hover{box-shadow:0 5px 14px rgba(0,0,0,.06)}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}.btn.danger{color:var(--danger)}.btn.ghost{background:transparent}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.stat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#eef2ff;color:#4f46e5;margin-bottom:15px}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.stat:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-25px;bottom:-35px;background:rgba(99,102,241,.06)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.toolbar{padding:15px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.search{flex:1;position:relative}.search input{width:100%;padding:11px 13px 11px 39px;border:1px solid var(--line);border-radius:10px;outline:none;background:var(--surface2)}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#9b8afb;box-shadow:0 0 0 3px rgba(99,102,241,.1)}.search span{position:absolute;left:13px;top:10px;color:#98a2b3}.toolbar select{min-width:160px}.select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.view-toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.view-toggle button{padding:9px 11px;background:var(--surface);color:var(--muted)}.view-toggle button.active{background:#eef2ff;color:var(--primary)}.category-pills{display:flex;gap:8px;flex-wrap:wrap;padding:14px 15px;border-bottom:1px solid var(--line)}.pill{padding:7px 11px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;font-size:11px;color:var(--muted);cursor:pointer}.pill.active{background:#eef2ff;color:var(--primary);border-color:#c7d2fe}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#98a2b3;text-align:left;padding:12px 15px;background:#fafbfc;white-space:nowrap}.table td{padding:13px 15px;border-top:1px solid var(--line);font-size:12px;vertical-align:middle}.site{display:flex;align-items:center;gap:11px;min-width:220px}.site-icon{width:36px;height:36px;border-radius:10px;background:#eef2ff;color:var(--primary);display:grid;place-items:center;font-weight:800;flex:none}.site-name{font-weight:700}.site-url{color:#98a2b3;font-size:10px;margin-top:2px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700}.badge.active{background:#e9f9f2;color:#087f5b}.badge.inactive{background:#f2f4f7;color:#667085}.cat-badge{padding:5px 8px;border-radius:7px;background:#f2f4f7;font-size:10px;color:#475467}.star{background:transparent;font-size:17px;color:#c7ced8}.star.on{color:#f59e0b}.row-actions{display:flex;gap:5px;justify-content:flex-end}.iconbtn{width:30px;height:30px;border-radius:8px;background:transparent;color:#667085}.iconbtn:hover{background:#f2f4f7;color:#111827}.cards{display:none;padding:15px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.cards.show{display:grid}.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--surface2)}.card-head{display:flex;justify-content:space-between;gap:10px}.card-url{font-size:10px;color:#98a2b3;margin:8px 0 13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card .open{width:100%;padding:9px;border-radius:9px;background:#fff;border:1px solid var(--line);font-weight:600}.empty{text-align:center;padding:45px;color:var(--muted);font-size:13px}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:50;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{background:var(--surface);width:min(560px,100%);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.2);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:19px 21px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:17px}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:#475467}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:var(--surface)}.field textarea{min-height:80px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#475467}.check input{width:16px;height:16px}.settings{padding:20px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.setting-row h4{margin:0 0 4px}.setting-row p{margin:0;color:var(--muted);font-size:11px}.switch{width:42px;height:23px;border-radius:99px;background:#d0d5dd;padding:3px}.switch i{display:block;width:17px;height:17px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--primary)}.switch.on i{transform:translateX(19px)}.toast{position:fixed;right:24px;bottom:24px;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:12px;display:none;z-index:80}.toast.show{display:block}.dark{--bg:#0b1220;--surface:#111827;--surface2:#182231;--text:#f8fafc;--muted:#98a2b3;--line:#273244;--shadow:0 12px 32px rgba(0,0,0,.18)}.dark .toolbar select,.dark .select,.dark .btn,.dark .field input,.dark .field select,.dark .field textarea,.dark .card .open,.dark .view-toggle button{color:var(--text);background:var(--surface)}.dark .table th{background:#141e2d}.dark .cat-badge,.dark .iconbtn:hover,.dark .pill{background:#202b3c}.dark .site-icon,.dark .view-toggle button.active,.dark .pill.active{background:#272a5b}.dark .search input{background:#182231;color:#fff}
    @media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.sidebar{width:215px}.main{margin-left:215px;width:calc(100% - 215px);padding:22px}.table th:nth-child(4),.table td:nth-child(4){display:none}}
    @media(max-width:720px){.sidebar{position:fixed;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%;padding:16px}.mobile-menu{display:block!important}.topbar{align-items:flex-start}.actions .label{display:none}.stats{grid-template-columns:1fr 1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.table-wrap{display:none}.cards{display:grid}.grid2{grid-template-columns:1fr}.page-title h2{font-size:21px}.sidebar-footer{display:none}}
    .mobile-menu{display:none}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brandmark">SI</div><div><h1>S. I. &amp; Co.</h1><small>Web Link Manager</small></div></div>
    <div class="nav-title">Workspace</div>
    <nav class="nav">
      <button class="active" data-page="dashboard">▦ <span>Dashboard</span></button>
      <button data-page="websites">🔗 <span>Websites</span><span class="count" id="navSites">0</span></button>
      <button data-page="categories">▤ <span>Categories</span><span class="count" id="navCats">0</span></button>
      <button data-page="favorites">★ <span>Favorites</span><span class="count" id="navFavs">0</span></button>
      <button data-page="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-footer">Data is stored locally in your browser.<br>Use Export Backup to keep a copy.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="page-title"><button class="btn mobile-menu" id="mobileMenu">☰</button><h2 id="pageTitle" style="display:inline-block;margin-left:8px">Dashboard</h2><p id="pageSub">Your central hub for frequently used websites.</p></div>
      <div class="actions"><button class="btn" id="exportBtn">↧ <span class="label">Export</span></button><button class="btn primary" id="addBtn">＋ <span class="label">Add Website</span></button></div>
    </div>
    <section id="page-dashboard"></section>
    <section id="page-websites" style="display:none"></section>
    <section id="page-categories" style="display:none"></section>
    <section id="page-favorites" style="display:none"></section>
    <section id="page-settings" style="display:none"></section>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script>
const KEY='sico-web-links-v1';
const defaultData={categories:[
 {id:'c1',name:'Accounting',icon:'📊',color:'#4f46e5',sort:1},
 {id:'c2',name:'Banking',icon:'🏦',color:'#0f9d72',sort:2},
 {id:'c3',name:'Government',icon:'🏛️',color:'#d97706',sort:3},
 {id:'c4',name:'Business',icon:'💼',color:'#7c3aed',sort:4},
 {id:'c5',name:'Tools',icon:'🛠️',color:'#0891b2',sort:5}
],websites:[
 {id:'w1',name:'QuickBooks',url:'https://quickbooks.intuit.com/',categoryId:'c1',description:'Online accounting and bookkeeping',favorite:true,status:true,visits:0,created:Date.now(),updated:Date.now()},
 {id:'w2',name:'Xero',url:'https://www.xero.com/',categoryId:'c1',description:'Cloud accounting platform',favorite:true,status:true,visits:0,created:Date.now(),updated:Date.now()},
 {id:'w3',name:'Tally Solutions',url:'https://tallysolutions.com/',categoryId:'c1',description:'Business accounting software',favorite:false,status:true,visits:0,created:Date.now(),updated:Date.now()},
 {id:'w4',name:'GST Portal',url:'https://www.gst.gov.in/',categoryId:'c3',description:'Goods and Services Tax portal',favorite:true,status:true,visits:0,created:Date.now(),updated:Date.now()},
 {id:'w5',name:'Income Tax e-Filing',url:'https://www.incometax.gov.in/',categoryId:'c3',description:'Income tax e-filing portal',favorite:false,status:true,visits:0,created:Date.now(),updated:Date.now()},
 {id:'w6',name:'Google Drive',url:'https://drive.google.com/',categoryId:'c5',description:'Cloud file storage',favorite:false,status:true,visits:0,created:Date.now(),updated:Date.now()}
]};
let data=load();let currentPage='dashboard';let currentView='table';let filterCat='all';let searchTerm='';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.categories&&x.websites?x:structuredClone(defaultData)}catch{return structuredClone(defaultData)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function uid(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cat(id){return data.categories.find(c=>c.id===id)||{name:'Uncategorized',icon:'🔗',color:'#667085'}}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function domain(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return url}}
function initials(name){return (name||'W').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function setPage(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('main section').forEach(s=>s.style.display='none');document.getElementById('page-'+page).style.display='block';const titles={dashboard:['Dashboard','Your central hub for frequently used websites.'],websites:['Websites','Manage every website, URL, category and status.'],categories:['Categories','Organize your links into clean, reusable groups.'],favorites:['Favorites','Quick access to the websites you use most.'],settings:['Settings','Backup, restore and application preferences.']};document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];document.getElementById('sidebar').classList.remove('open');render();}
function filtered(){let arr=data.websites.filter(w=>filterCat==='all'||w.categoryId===filterCat);if(searchTerm)arr=arr.filter(w=>(w.name+' '+w.url+' '+w.description+' '+cat(w.categoryId).name).toLowerCase().includes(searchTerm.toLowerCase()));if(currentPage==='favorites')arr=arr.filter(w=>w.favorite);return arr.sort((a,b)=>b.updated-a.updated)}
function stats(){return `<div class="stats"><div class="stat"><div class="ico">🔗</div><strong>${data.websites.length}</strong><span>Total Websites</span></div><div class="stat"><div class="ico">✓</div><strong>${data.websites.filter(w=>w.status).length}</strong><span>Active Websites</span></div><div class="stat"><div class="ico">▤</div><strong>${data.categories.length}</strong><span>Categories</span></div><div class="stat"><div class="ico">★</div><strong>${data.websites.filter(w=>w.favorite).length}</strong><span>Favorites</span></div></div>`}
function siteRows(arr){if(!arr.length)return `<div class="empty">No websites found.<br><button class="btn primary" style="margin-top:12px" onclick="openWebsiteModal()">Add your first website</button></div>`;return `<div class="table-wrap"><table class="table"><thead><tr><th>Website</th><th>Category</th><th>Status</th><th>Last Updated</th><th></th></tr></thead><tbody>${arr.map(w=>{const c=cat(w.categoryId);return `<tr><td><div class="site"><div class="site-icon">${c.icon||initials(w.name)}</div><div><div class="site-name">${esc(w.name)}</div><div class="site-url">${esc(domain(w.url))}</div></div></div></td><td><span class="cat-badge">${esc(c.icon)} ${esc(c.name)}</span></td><td><span class="badge ${w.status?'active':'inactive'}">${w.status?'Active':'Inactive'}</span></td><td style="color:var(--muted)">${new Date(w.updated).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</td><td><div class="row-actions"><button class="star ${w.favorite?'on':''}" title="Favorite" onclick="toggleFav('${w.id}')">★</button><button class="iconbtn" title="Open" onclick="openSite('${w.id}')">↗</button><button class="iconbtn" title="Edit" onclick="openWebsiteModal('${w.id}')">✏</button><button class="iconbtn" title="Delete" onclick="deleteWebsite('${w.id}')">🗑</button></div></td></tr>`}).join('')}</tbody></table></div><div class="cards ${currentView==='cards'?'show':''}">${arr.map(w=>{const c=cat(w.categoryId);return `<div class="card"><div class="card-head"><div class="site"><div class="site-icon">${c.icon}</div><div><div class="site-name">${esc(w.name)}</div><span class="cat-badge">${esc(c.name)}</span></div></div><button class="star ${w.favorite?'on':''}" onclick="toggleFav('${w.id}')">★</button></div><div class="card-url">${esc(w.url)}</div><p style="font-size:11px;color:var(--muted);min-height:28px">${esc(w.description||'')}</p><button class="open" onclick="openSite('${w.id}')">Open Website ↗</button><div class="row-actions" style="margin-top:8px"><button class="iconbtn" onclick="openWebsiteModal('${w.id}')">✏ Edit</button><button class="iconbtn" onclick="deleteWebsite('${w.id}')">🗑</button></div></div>`}).join('')}</div>`}
function controls(){return `<div class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input id="siteSearch" value="${esc(searchTerm)}" placeholder="Search website, URL, category or description..." oninput="searchTerm=this.value;renderWebsites()"></div><select class="select" id="catFilter" onchange="filterCat=this.value;renderWebsites()"><option value="all">All Categories</option>${data.categories.map(c=>`<option value="${c.id}" ${filterCat===c.id?'selected':''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}</select><div class="view-toggle"><button class="${currentView==='table'?'active':''}" onclick="currentView='table';renderWebsites()">☷</button><button class="${currentView==='cards'?'active':''}" onclick="currentView='cards';renderWebsites()">▦</button></div></div><div class="category-pills"><span class="pill ${filterCat==='all'?'active':''}" onclick="filterCat='all';renderWebsites()">All</span>${data.categories.map(c=>`<span class="pill ${filterCat===c.id?'active':''}" onclick="filterCat='${c.id}';renderWebsites()">${esc(c.icon)} ${esc(c.name)}</span>`).join('')}</div>${siteRows(filtered())}</div>`}
function renderWebsites(){document.getElementById('page-websites').innerHTML=controls()}
function renderDashboard(){const recent=[...data.websites].sort((a,b)=>b.updated-a.updated).slice(0,5);document.getElementById('page-dashboard').innerHTML=stats()+`<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:18px"><div class="panel"><div style="padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><strong>Recently Updated</strong><button class="btn" onclick="setPage('websites')">View All</button></div>${siteRows(recent)}</div><div class="panel"><div style="padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><strong>Categories</strong><button class="btn" onclick="setPage('categories')">Manage</button></div><div style="padding:14px">${data.categories.map(c=>{let n=data.websites.filter(w=>w.categoryId===c.id).length;return `<div style="display:flex;align-items:center;gap:11px;padding:12px 4px"><span style="font-size:18px">${c.icon}</span><div style="flex:1"><div style="font-weight:600;font-size:12px">${esc(c.name)}</div><div style="height:5px;background:var(--line);border-radius:99px;margin-top:7px"><div style="height:100%;width:${Math.min(100,n/data.websites.length*100||0)}%;background:${c.color};border-radius:99px"></div></div></div><b style="font-size:12px">${n}</b></div>`}).join('')}</div></div></div>`}
function renderCategories(){document.getElementById('page-categories').innerHTML=`<div class="panel"><div style="padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)"><strong>Website Categories</strong><button class="btn primary" onclick="openCategoryModal()">＋ Add Category</button></div><div style="padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">${data.categories.map(c=>{let n=data.websites.filter(w=>w.categoryId===c.id).length;return `<div class="card"><div style="display:flex;justify-content:space-between"><div style="font-size:26px">${c.icon}</div><div><button class="iconbtn" onclick="openCategoryModal('${c.id}')">✏</button><button class="iconbtn" onclick="deleteCategory('${c.id}')">🗑</button></div></div><h3 style="font-size:14px;margin:10px 0 3px">${esc(c.name)}</h3><span style="font-size:11px;color:var(--muted)">${n} website${n===1?'':'s'}</span></div>`}).join('')}</div></div>`}
function renderSettings(){document.getElementById('page-settings').innerHTML=`<div class="panel settings"><h3 style="margin-top:0">Application Settings</h3><div class="setting-row"><div><h4>Dark Mode</h4><p>Switch between light and dark dashboard themes.</p></div><div class="switch ${document.body.classList.contains('dark')?'on':''}" onclick="toggleTheme()"><i></i></div></div><div class="setting-row"><div><h4>Export Backup</h4><p>Download all websites and categories as a JSON backup.</p></div><button class="btn" onclick="exportData()">Export JSON</button></div><div class="setting-row"><div><h4>Restore Backup</h4><p>Replace the current data with a previously exported backup.</p></div><button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button></div><div class="setting-row"><div><h4>Reset Demo Data</h4><p>Restore the sample websites and categories.</p></div><button class="btn danger" onclick="resetData()">Reset Data</button></div></div>`}
function render(){document.getElementById('navSites').textContent=data.websites.length;document.getElementById('navCats').textContent=data.categories.length;document.getElementById('navFavs').textContent=data.websites.filter(w=>w.favorite).length;renderDashboard();renderWebsites();renderCategories();renderSettings();if(currentPage==='dashboard'){} }
function renderFavorites(){document.getElementById('page-favorites').innerHTML=stats()+controls()}
function openSite(id){const w=data.websites.find(x=>x.id===id);if(!w)return;w.visits=(w.visits||0)+1;w.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(data));window.open(w.url,'_blank','noopener,noreferrer')}
function toggleFav(id){const w=data.websites.find(x=>x.id===id);w.favorite=!w.favorite;w.updated=Date.now();save();toast(w.favorite?'Added to favorites':'Removed from favorites')}
function openWebsiteModal(id){const w=id?data.websites.find(x=>x.id===id):null;document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>${w?'Edit Website':'Add Website'}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="grid2"><div class="field"><label>Website Name *</label><input id="fName" value="${esc(w?.name||'')}" placeholder="e.g. QuickBooks"></div><div class="field"><label>Category *</label><select id="fCat">${data.categories.map(c=>`<option value="${c.id}" ${w?.categoryId===c.id?'selected':''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}</select></div></div><div class="field"><label>Website URL *</label><input id="fUrl" value="${esc(w?.url||'')}" placeholder="https://example.com"></div><div class="field"><label>Description</label><textarea id="fDesc" placeholder="Short description">${esc(w?.description||'')}</textarea></div><div class="grid2"><div class="field"><label>Status</label><select id="fStatus"><option value="1" ${w?.status!==false?'selected':''}>Active</option><option value="0" ${w?.status===false?'selected':''}>Inactive</option></select></div><div class="field" style="padding-top:26px"><label class="check"><input type="checkbox" id="fFav" ${w?.favorite?'checked':''}> Add to Favorites</label></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveWebsite('${id||''}')">${w?'Save Changes':'Add Website'}</button></div>`;document.getElementById('modalBackdrop').classList.add('show')}
function saveWebsite(id){const name=document.getElementById('fName').value.trim(),url=document.getElementById('fUrl').value.trim(),categoryId=document.getElementById('fCat').value;if(!name||!url||!categoryId){toast('Please complete the required fields');return}let normalized=url;if(!/^https?:\/\//i.test(normalized))normalized='https://'+normalized;try{new URL(normalized)}catch{toast('Please enter a valid URL');return}const obj={name,url:normalized,categoryId,description:document.getElementById('fDesc').value.trim(),favorite:document.getElementById('fFav').checked,status:document.getElementById('fStatus').value==='1',updated:Date.now()};if(id){Object.assign(data.websites.find(w=>w.id===id),obj)}else{data.websites.push({id:uid('w'),visits:0,created:Date.now(),...obj})}save();closeModal();toast(id?'Website updated':'Website added')}
function deleteWebsite(id){const w=data.websites.find(x=>x.id===id);if(!w||!confirm(`Delete "${w.name}"?`))return;data.websites=data.websites.filter(x=>x.id!==id);save();toast('Website deleted')}
function openCategoryModal(id){const c=id?data.categories.find(x=>x.id===id):null;document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>${c?'Edit Category':'Add Category'}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="grid2"><div class="field"><label>Category Name *</label><input id="cName" value="${esc(c?.name||'')}" placeholder="e.g. Banking"></div><div class="field"><label>Icon</label><input id="cIcon" value="${esc(c?.icon||'🔗')}" maxlength="4" placeholder="📁"></div></div><div class="field"><label>Accent Color</label><input id="cColor" type="color" value="${c?.color||'#4f46e5'}" style="height:42px;padding:4px"></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCategory('${id||''}')">Save Category</button></div>`;document.getElementById('modalBackdrop').classList.add('show')}
function saveCategory(id){const name=document.getElementById('cName').value.trim();if(!name){toast('Category name is required');return}const obj={name,icon:document.getElementById('cIcon').value.trim()||'🔗',color:document.getElementById('cColor').value,sort:Date.now()};if(id)Object.assign(data.categories.find(c=>c.id===id),obj);else data.categories.push({id:uid('c'),...obj});save();closeModal();toast(id?'Category updated':'Category added')}
function deleteCategory(id){const c=data.categories.find(x=>x.id===id),count=data.websites.filter(w=>w.categoryId===id).length;if(!c)return;if(count&& !confirm(`${count} website(s) use this category. They will become Uncategorized. Continue?`))return;if(!count&&!confirm(`Delete "${c.name}"?`))return;data.websites.forEach(w=>{if(w.categoryId===id)w.categoryId=''});data.categories=data.categories.filter(x=>x.id!==id);save();toast('Category deleted')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sico-web-link-manager-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function resetData(){if(!confirm('Reset all data to the original demo data?'))return;data=structuredClone(defaultData);save();toast('Demo data restored')}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('linkhub-theme',document.body.classList.contains('dark')?'dark':'light');renderSettings()}
document.getElementById('exportBtn').onclick=exportData;document.getElementById('addBtn').onclick=()=>openWebsiteModal();document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.categories)||!Array.isArray(x.websites))throw 0;data=x;save();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f);e.target.value=''};
if(localStorage.getItem('linkhub-theme')==='dark')document.body.classList.add('dark');
render();
</script>
</body>
</html>
